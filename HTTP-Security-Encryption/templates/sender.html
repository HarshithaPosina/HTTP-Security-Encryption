<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
 
  </head>
  <body>
    <h1>Send Message App</h1>

  <form action="/send_message" method="POST">
    <p>Send a message:</p>
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="4" cols="50"></textarea>
    <br>
    <input type="submit" class="btn btn-success" value="Send Message">
  </form>

  <button class="btn btn-primary" onclick="document.getElementById('image').style.display = 'block'">OSI Layer</button>
  <img id="image" src="{{ url_for('static', filename='images/SenderOSI.svg') }}" alt="Example Image" style="display: none;">

</body>

</html>
